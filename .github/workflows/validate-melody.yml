name: Validate melody feature

on:
  push:
    branches:
      - feature/melody-simplification
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build x64 Debug
        run: dotnet build Muno.slnx --configuration Debug -p:Platform=x64 --warnaserror
